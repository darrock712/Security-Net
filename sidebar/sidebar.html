<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Net</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

    /* Color */
    :root {
      --bg: #0f1923;
      --surface: #162030;
      --surface2: #1e2d3d;
      --border: #253545;
      --gold: #c8b88a;
      --gold-light: #e8d8aa;
      --text: #d8e4f0;
      --muted: #7a8a9a;
      --green: #3db87a;
      --yellow: #e0b040;
      --red: #e05050;
      --green-bg: #0a2018;
      --yellow-bg: #231800;
      --red-bg: #200a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--surface);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { font-size: 18px; }
    .logo-text { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--gold); }
    .close-btn {
      background: none; border: none; color: var(--muted); font-size: 20px;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1;
    }
    .close-btn:hover { background: var(--surface2); color: var(--text); }

    /* Scrollable Content Area */
    .scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .scroll::-webkit-scrollbar { width: 4px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* States - only one shows at a time */
    #stateIdle, #stateLoading, #stateResults { display: none; }
    #stateIdle.active, #stateLoading.active, #stateResults.active { display: block; }

    /* Idle State */
    .idle-card { text-align: center; padding: 40px 20px; }
    .idle-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.7; }
    .idle-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--gold); margin-bottom: 8px; }
    .idle-sub { color: var(--muted); line-height: 1.6; font-size: 13px; }

    /* Loading State */
    .loading-card { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 20px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--gold); margin-bottom: 6px; }
    .loading-step { color: var(--muted); font-size: 12px; }

    /* Section Label */
    .section-label {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px; margin-top: 20px;
    }
    .section-label:first-child { margin-top: 0; }

    /* Term Cards (Task 1) */
    .term-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .term-card:hover { border-color: #3a5a7a; }
    .term-card.risk-low { border-left: 3px solid var(--green); }
    .term-card.risk-medium { border-left: 3px solid var(--yellow); }
    .term-card.risk-high { border-left: 3px solid var(--red); }
    
    /* Highlight for newly added custom categories */
    .term-card.just-added {
      animation: pulse-gold 0.6s ease-out 2;
      box-shadow: 0 0 12px rgba(200, 184, 138, 0.4);
    }
    @keyframes pulse-gold {
      0%, 100% { border-color: var(--border); }
      50% { border-color: var(--gold); }
    }

    .subtopic-card {
      margin-left: 18px;
      border-left: 3px solid var(--gold) !important;
      opacity: 0.92;
    }
    .subtopic-card .term-name { font-size: 12px; color: var(--muted); }
    .subtopic-card .term-value { display: none; }

    .subtopic-delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .subtopic-delete:hover { color: var(--red); }

    .term-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; cursor: pointer;
    }
    .term-left { display: flex; align-items: center; gap: 10px; }
    .risk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .risk-dot.low { background: var(--green); }
    .risk-dot.medium { background: var(--yellow); }
    .risk-dot.high { background: var(--red); }
    .term-name { font-weight: 500; font-size: 13px; }
    .term-value {
      font-size: 12px; color: var(--gold); font-weight: 500;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .expand-arrow { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
    .term-card.open .expand-arrow { transform: rotate(180deg); }

    /* Term Card Expanded Content */
    .term-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .term-card.open .term-body { display: block; }
    .term-explanation { color: var(--text); line-height: 1.65; font-size: 13px; padding-top: 12px; margin-bottom: 10px; }
    .term-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .meta-badge { padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid #1a4a30; }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #3a2800; }
    .badge-red { background: var(--red-bg); color: var(--red); border: 1px solid #3a1010; }
    .badge-gray { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .term-citation { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 12px; }

    /* Follow-up Question */
    .followup-area { margin-top: 4px; }
    .followup-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .followup-input-row { display: flex; gap: 6px; }
    .followup-input {
      flex: 1; padding: 8px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 12px;
      font-family: 'DM Sans', sans-serif; outline: none;
    }
    .followup-input:focus { border-color: var(--gold); }
    .followup-btn {
      padding: 8px 12px; background: var(--gold); color: var(--bg);
      border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap;
    }
    .followup-btn:hover { background: var(--gold-light); }
    .followup-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .followup-response {
      margin-top: 10px; padding: 10px 12px;
      background: var(--surface2); border-radius: 6px;
      font-size: 12px; line-height: 1.65; color: var(--text);
      border-left: 2px solid var(--gold); display: none;
    }

    /* Source Quote */
    .source-quote {
      margin-bottom: 10px; padding: 8px 10px;
      background: var(--surface2); border-left: 2px solid var(--border);
      border-radius: 0 4px 4px 0;
    }
    .source-quote-label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
    .source-quote-text { font-size: 11px; color: var(--text); font-style: italic; line-height: 1.55; }

    /* Term Actions Row (jump + correction buttons) */
    .term-actions-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

    .term-explanation.has-source {
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 4px;
      padding: 4px 6px;
      margin: -4px -6px 10px;
    }
    .term-explanation.has-source:hover {
      background: var(--surface2);
      outline: 1px solid var(--border);
    }
    .source-hint {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      vertical-align: middle;
    }
    .term-explanation.has-source:hover .source-hint {
      color: var(--gold);
    }

    .highlight-phrase {
      background: rgba(200, 184, 138, 0.18);
      border-bottom: 1px dashed var(--gold);
      border-radius: 2px;
      cursor: pointer;
      padding: 0 2px;
      transition: background 0.15s;
    }
    .highlight-phrase:hover {
      background: rgba(200, 184, 138, 0.38);
    }

    /* Correction Button */
    .correct-row { margin-top: 8px; }
    .correct-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); font-size: 11px; padding: 4px 10px;
      border-radius: 4px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }

    /* Correction Choices */
    .correct-choices-label {
      font-size: 11px; color: var(--muted); margin-bottom: 6px; margin-top: 8px;
    }
    .correct-choices {
      display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
    }
    .correct-choice-btn {
      text-align: left; padding: 7px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 11px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.15s;
    }
    .correct-choice-btn:hover { border-color: var(--gold); color: var(--gold); }
    .correct-choice-btn.selected { border-color: var(--gold); color: var(--gold); background: #1e2d3d; }
    .correct-divider-label {
      font-size: 10px; color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .correct-btn:hover { border-color: var(--yellow); color: var(--yellow); }

    /* Correction Form (inline) */
    .correct-form { margin-top: 4px; }
    .correct-current { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .correct-current-val { color: var(--gold); font-weight: 500; }
    .correct-input {
      width: 100%; padding: 8px 10px; margin-bottom: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 12px;
      font-family: 'DM Sans', sans-serif; outline: none;
    }
    .correct-input:focus { border-color: var(--gold); }
    .correct-actions { display: flex; gap: 6px; }
    .correct-verify-btn {
      padding: 6px 12px; background: var(--gold); color: var(--bg);
      border: none; border-radius: 5px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .correct-verify-btn:hover { background: var(--gold-light); }
    .correct-verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .correct-cancel-btn {
      padding: 6px 12px; background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 5px; font-size: 11px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .correct-cancel-btn:hover { border-color: var(--red); color: var(--red); }
    .correct-verify-result {
      margin-top: 8px; padding: 8px 10px; border-radius: 5px;
      font-size: 11px; line-height: 1.55; display: none;
    }
    .verdict-ok { background: var(--green-bg); color: var(--green); border-left: 2px solid var(--green); }
    .verdict-warn { background: var(--red-bg); color: #cc8080; border-left: 2px solid var(--red); }
    .verdict-uncertain { background: var(--yellow-bg); color: var(--yellow); border-left: 2px solid var(--yellow); }
    .correct-reason { font-style: italic; }
    .correct-confirm-row { margin-top: 8px; display: flex; gap: 6px; }
    .correct-apply-btn {
      padding: 5px 10px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; font-size: 11px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .correct-apply-btn:hover { border-color: var(--green); color: var(--green); }
    .correct-cancel-inline-btn {
      padding: 5px 10px; background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 4px; font-size: 11px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .correct-cancel-inline-btn:hover { border-color: var(--red); color: var(--red); }

    /* Priority Banner (Task 2) */
    .priority-banner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-top: 20px;
    }
    .priority-banner-title { font-family: 'DM Serif Display', serif; font-size: 14px; color: var(--gold); margin-bottom: 4px; }
    .priority-banner-sub { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }

    /* Free Text Input */
    .priority-input-row {
      display: flex; gap: 6px; margin-bottom: 10px;
    }
    .priority-free-input {
      flex: 1; padding: 9px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 12px;
      font-family: 'DM Sans', sans-serif; outline: none;
    }
    .priority-free-input:focus { border-color: var(--gold); }
    .priority-add-btn {
      padding: 9px 14px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted); font-size: 12px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; white-space: nowrap;
    }
    .priority-add-btn:hover { border-color: var(--gold); color: var(--gold); }
    .priority-add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Memories Section */
    .memories-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-top: 12px; overflow: hidden;
    }
    .memories-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; cursor: pointer;
    }
    .memories-header:hover { background: var(--surface2); }
    .memories-title { font-size: 12px; color: var(--muted); }
    .memories-toggle {
      background: none; border: none; color: var(--muted);
      font-size: 10px; cursor: pointer; transition: transform 0.2s;
    }
    .memories-section.open .memories-toggle { transform: rotate(180deg); }
    .memories-list {
      display: none; padding: 0 14px 10px;
    }
    .memories-section.open .memories-list { display: block; }
    .memories-hint {
      display: none; padding: 0 14px 10px;
      font-size: 10px; color: var(--muted); font-style: italic;
    }
    .memories-section.open .memories-hint { display: block; }
    .memory-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .memory-item:last-child { border-bottom: none; }
    .memory-name { font-size: 12px; color: var(--text); }
    .memory-delete {
      background: none; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 2px 6px;
    }
    .memory-delete:hover { color: var(--red); }
    .memories-empty {
      font-size: 11px; color: var(--muted); padding: 4px 0;
      font-style: italic;
    }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* View Full Document Button */
    .view-doc-btn {
      width: 100%; padding: 10px; margin-bottom: 12px;
      background: none; border: 1px solid var(--gold); color: var(--gold);
      border-radius: 6px; font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background 0.15s;
    }
    .view-doc-btn:hover { background: rgba(200, 184, 138, 0.1); }

    /* Quoted text from source sections */
    .term-quote {
      font-style: italic;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border-left: 2px solid var(--gold);
      padding: 8px 10px;
      margin: 8px 0;
      border-radius: 0 4px 4px 0;
      line-height: 1.55;
    }

    /* Source section references */
    .term-sources {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <span class="logo-icon">🛡</span>
    <span class="logo-text">Security Net</span>
  </div>
  <button class="close-btn" id="closeBtn">✕</button>
</div>

<div class="scroll">

  <!-- Idle State -->
  <div id="stateIdle">
    <div class="idle-card">
      <div class="idle-icon">📄</div>
      <div class="idle-title">Ready to analyze</div>
      <div class="idle-sub">Click "Analyze This Lease" in the extension popup to get started.</div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="stateLoading">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">Reading your lease</div>
      <div class="loading-step" id="loadingStep">Extracting text…</div>
    </div>
  </div>

  <!-- Results State -->
  <div id="stateResults">

    <!-- Summarization and Review -->
    <div class="section-label">Summarization and Review</div>
    <div id="termsList"></div>

    <div class="divider"></div>

    <!-- Prioritize and Personalized -->
    <div class="priority-banner">
      <div class="priority-banner-title">Add Custom Topic</div>
      <div class="priority-banner-sub">Analyze something specific not covered above.</div>
      <div class="priority-input-row">
        <input
          type="text"
          class="priority-free-input"
          id="priorityFreeText"
          placeholder="e.g. 'smoking policy' or 'I have a large dog'"
        />
        <button class="priority-add-btn" id="priorityAddBtn">+ Add</button>
      </div>
    </div>

    <!-- Saved Topics (Memories) -->
    <div class="memories-section" id="memoriesSection" style="display: none;">
      <div class="memories-header">
        <span class="memories-title">📌 Saved Topics</span>
        <button class="memories-toggle" id="memoriesToggle">▼</button>
      </div>
      <div class="memories-list" id="memoriesList"></div>
      <div class="memories-hint">These topics are analyzed automatically on every lease.</div>
    </div>

  </div>
</div>

<script src="../lib/pdf.min.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
